name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* 2>/dev/null || true
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer 2>/dev/null || true
          xcodebuild -version || true

      - name: Compile IceCreamKids iOS Executable with swiftc
        run: |
          mkdir -p build/IceCreamKids.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK at: $SDK_PATH"
          SWIFT_FILES=$(find ios/IceCreamKids -name "*.swift" | sort | tr '\n' ' ')
          echo "Compiling Swift files: $SWIFT_FILES"
          swiftc -v -parse-as-library -target arm64-apple-ios16.0 -sdk "$SDK_PATH" \
            -framework SwiftUI \
            -framework UIKit \
            -framework AVFoundation \
            -framework Foundation \
            -framework Combine \
            $SWIFT_FILES \
            -o build/IceCreamKids.app/IceCreamKids \
            -emit-executable
          chmod +x build/IceCreamKids.app/IceCreamKids
          ls -lh build/IceCreamKids.app/IceCreamKids
          file build/IceCreamKids.app/IceCreamKids

      - name: Package Real IPA
        run: |
          rm -rf Payload IceCreamKids_iOS.ipa
          mkdir -p Payload/IceCreamKids.app
          cp build/IceCreamKids.app/IceCreamKids Payload/IceCreamKids.app/
          cp ios/IceCreamKids/Info.plist Payload/IceCreamKids.app/Info.plist
          echo "APPL????" > Payload/IceCreamKids.app/PkgInfo
          if [ -d "ios/IceCreamKids/Resources/Assets" ]; then
            cp -R ios/IceCreamKids/Resources/Assets/* Payload/IceCreamKids.app/
          fi
          if [ -d "ios/IceCreamKids/Resources/Audio" ]; then
            cp -R ios/IceCreamKids/Resources/Audio/* Payload/IceCreamKids.app/
          fi
          codesign -s - --force --deep Payload/IceCreamKids.app || true
          zip -qr IceCreamKids_iOS.ipa Payload
          ls -lh IceCreamKids_iOS.ipa

      - name: Upload IceCreamKids iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IceCreamKids_iOS_Release
          path: IceCreamKids_iOS.ipa
          retention-days: 14

      - name: Create GitHub Release
        continue-on-error: true
        run: |
          gh release delete v1.0.0 --yes || true
          gh release create v1.0.0 IceCreamKids_iOS.ipa \
            --title "Ice Cream Kids iOS v1.0.0" \
            --notes "Native iOS IPA release for Sideloadly, AltStore, and TrollStore."
        env:
          GH_TOKEN: ${{ github.token }}
